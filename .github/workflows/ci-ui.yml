name: UI Tests (Selenium + Docker Compose)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services
        run: |
          set -eux
          docker compose -f app/docker-compose.ci.yml up -d --build

      - name: Wait for Selenium (health)
        run: |
          set -eux
          SEL_ID="$(docker compose -f app/docker-compose.ci.yml ps -q selenium)"
          echo "Selenium container id: $SEL_ID"

          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$SEL_ID" 2>/dev/null || true)"
            echo "Selenium health: $status"
            if [ "$status" = "healthy" ]; then
              echo "Selenium is healthy ✅"
              exit 0
            fi
            sleep 2
          done

          echo "Selenium did not become healthy ❌"
          docker compose -f app/docker-compose.ci.yml logs selenium --tail=200 || true
          exit 1

      - name: Wait for App and verify /login has username field
        run: |
          set -eux
          APP_ID="$(docker compose -f app/docker-compose.ci.yml ps -q app)"
          echo "App container id: $APP_ID"

          for i in $(seq 1 60); do
            echo "Checking /login inside app container... ($i)"

            # Get headers + body (so we can see redirects/404/500/etc)
            HTML="$(docker exec "$APP_ID" sh -lc 'wget -S -O- http://localhost:8080/login 2>&1' || true)"

            # Accept both single and double quotes
            echo "$HTML" | grep -Eq "data-testid=['\"]username['\"]" && {
              echo "Login page contains username field ✅"
              exit 0
            }

            # Every 10 tries show a short preview
            if [ $((i % 10)) -eq 0 ]; then
              echo "---- DEBUG preview (headers + first 120 lines) ----"
              echo "$HTML" | head -n 120 || true
              echo "-----------------------------------------------"
            fi

            sleep 2
          done

          echo "Login page did not become ready ❌"

          echo "---- FINAL /login output (headers + first 200 lines) ----"
          docker exec "$APP_ID" sh -lc 'wget -S -O- http://localhost:8080/login 2>&1 | head -n 200' || true

          echo "---- APP LOGS (last 200 lines) ----"
          docker compose -f app/docker-compose.ci.yml logs app --tail=200 || true

          exit 1

      - name: Run UI tests
        run: |
          set -eux
          docker compose -f app/docker-compose.ci.yml run --rm tests mvn test

      - name: Print logs on failure
        if: failure()
        run: |
          docker compose -f app/docker-compose.ci.yml logs --no-color --tail=300 || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f app/docker-compose.ci.yml down -v || true
