name: UI Tests (Selenium + Docker Compose)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services
        run: |
          set -eux
          docker compose -f app/docker-compose.ci.yml up -d --build

      - name: Wait for Selenium + App
        run: |
          set -eux
          echo "Waiting for Selenium..."
          for i in {1..30}; do
            if curl -s http://localhost:4444/status | grep -q '"ready":true'; then
              echo "Selenium is ready"
              break
            fi
            sleep 2
          done

          echo "Checking app homepage..."
          curl -sSf http://localhost:8080/ | head -c 200
          echo

      - name: Debug /login HTML
        run: |
          set -eux
          echo "---- /login HTML (first 120 lines) ----"
          curl -sS http://localhost:8080/login | sed -n '1,120p' || true
          echo
          echo "---- grep for data-testid=username ----"
          curl -sS http://localhost:8080/login | grep -n 'data-testid="username"' || true
          echo

      - name: Run UI tests
        run: |
          set -eux
          docker compose -f app/docker-compose.ci.yml run --rm tests mvn test

      - name: Print logs on failure
        if: failure()
        run: |
          docker compose -f app/docker-compose.ci.yml logs --no-color --tail=200 || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f app/docker-compose.ci.yml down -v || true
