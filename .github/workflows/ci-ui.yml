name: UI Tests (Selenium + Docker Compose)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services
        run: |
          set -eux
          docker compose -f app/docker-compose.ci.yml up -d --build

      # ✅ RELIABLE Selenium wait via Docker health
      - name: Wait for Selenium (health)
        run: |
          set -eux
          SEL_ID="$(docker compose -f app/docker-compose.ci.yml ps -q selenium)"
          echo "Selenium container id: $SEL_ID"

          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$SEL_ID" 2>/dev/null || true)"
            echo "Selenium health: $status"
            if [ "$status" = "healthy" ]; then
              echo "Selenium is healthy ✅"
              exit 0
            fi
            sleep 2
          done

          echo "Selenium did not become healthy ❌"
          docker compose -f app/docker-compose.ci.yml logs selenium --tail=200 || true
          exit 1

      # ✅ Wait for APP to respond first, then verify /login exists + has username field
      - name: Wait for App and verify /login has username field
        run: |
          set -eux
          APP_ID="$(docker compose -f app/docker-compose.ci.yml ps -q app)"
          echo "App container id: $APP_ID"

          echo "Waiting for app to respond on / ..."
          for i in $(seq 1 60); do
            if docker exec "$APP_ID" sh -lc 'wget -qO- http://localhost:8080/ >/dev/null 2>&1'; then
              echo "App responds on / ✅"
              break
            fi
            echo "Waiting for app... ($i)"
            sleep 2
          done

          echo "Waiting for /login to return 200 and contain username field..."
          for i in $(seq 1 60); do
            # Get only HTTP status line
            STATUS="$(docker exec "$APP_ID" sh -lc 'wget -S -O- http://localhost:8080/login 2>&1 | head -n 1' || true)"

            # If it's 200, check HTML contains the field
            if echo "$STATUS" | grep -q "200 OK"; then
              if docker exec "$APP_ID" sh -lc "wget -qO- http://localhost:8080/login | grep -Eq \"data-testid=['\\\"']username['\\\"']\""; then
                echo "/login is ready ✅"
                exit 0
              fi
              echo "/login is 200 but username field not found yet... ($i)"
            else
              echo "Login not ready yet: $STATUS ($i)"
            fi

            # Every 10 tries show a short debug preview
            if [ $((i % 10)) -eq 0 ]; then
              echo "---- DEBUG /login (status + first 60 lines) ----"
              docker exec "$APP_ID" sh -lc 'wget -S -O- http://localhost:8080/login 2>&1 | head -n 60' || true
              echo "----------------------------------------------"
            fi

            sleep 2
          done

          echo "❌ /login did not become ready in time"
          echo "---- FINAL /login (status + first 120 lines) ----"
          docker exec "$APP_ID" sh -lc 'wget -S -O- http://localhost:8080/login 2>&1 | head -n 120' || true

          echo "---- APP LOGS (last 200) ----"
          docker compose -f app/docker-compose.ci.yml logs app --tail=200 || true

          exit 1

      - name: Run UI tests
        run: |
          set -eux
          docker compose -f app/docker-compose.ci.yml run --rm tests mvn test

      - name: Print logs on failure
        if: failure()
        run: |
          docker compose -f app/docker-compose.ci.yml logs --no-color --tail=300 || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f app/docker-compose.ci.yml down -v || true
