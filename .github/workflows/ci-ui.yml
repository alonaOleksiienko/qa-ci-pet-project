name: UI Tests (Selenium + Docker Compose)
on:
  push:
    branches: [ "main" ]
  pull_request:
jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and start services
        run: |
          set -eux
          docker compose -f app/docker-compose.ci.yml up -d --build
      
      - name: Wait for Selenium (health)
        run: |
          set -eux
          SEL_ID="$(docker compose -f app/docker-compose.ci.yml ps -q selenium)"
          echo "Selenium container id: $SEL_ID"
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$SEL_ID" 2>/dev/null || true)"
            echo "Selenium health: $status"
            if [ "$status" = "healthy" ]; then
              echo "Selenium is healthy ✅"
              exit 0
            fi
            sleep 2
          done
          echo "Selenium did not become healthy ❌"
          docker compose -f app/docker-compose.ci.yml logs selenium --tail=200 || true
          exit 1
      
      - name: Wait for App and verify /login has username field
        run: |
          set -eux
          APP_ID="$(docker compose -f app/docker-compose.ci.yml ps -q app)"
          echo "App container id: $APP_ID"
          
          echo "Waiting for app to respond on / ..."
          for i in $(seq 1 60); do
            if docker exec "$APP_ID" sh -c 'wget -qO- http://localhost:8080/ >/dev/null 2>&1'; then
              echo "App responds on / ✅"
              break
            fi
            echo "Waiting for app... ($i)"
            sleep 2
          done
          
          echo "Waiting for /login to return 200 and contain username field..."
          for i in $(seq 1 30); do
            # Get full response and check for both 200 status AND data-testid
            RESPONSE="$(docker exec "$APP_ID" sh -c 'wget -S -O- http://localhost:8080/login 2>&1' || true)"
            
            # Check if response contains "200" status
            if echo "$RESPONSE" | grep -q "HTTP/1.1 200"; then
              echo "Got HTTP 200 ✅"
              # Check if response contains data-testid="username"
              if echo "$RESPONSE" | grep -q 'data-testid="username"'; then
                echo "/login has username field ✅"
                echo "Login page is ready! ✅"
                exit 0
              else
                echo "200 OK but username field not found yet..."
              fi
            else
              echo "Waiting for 200 response... ($i)"
            fi
            sleep 2
          done
          
          echo "❌ /login did not become ready in time"
          echo "---- FINAL DEBUG ----"
          docker exec "$APP_ID" sh -c 'wget -S -O- http://localhost:8080/login 2>&1 | head -n 50' || true
          exit 1
      
      - name: Run UI tests
        run: |
          set -eux
          docker compose -f app/docker-compose.ci.yml run --rm tests mvn test
      
      - name: Print logs on failure
        if: failure()
        run: |
          docker compose -f app/docker-compose.ci.yml logs --no-color --tail=300 || true
      
      - name: Cleanup
        if: always()
        run: |
          docker compose -f app/docker-compose.ci.yml down -v || true
