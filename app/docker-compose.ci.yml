services:
  selenium:
    image: seleniarm/standalone-chromium:latest
    shm_size: 2gb
    ports:
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/4444'"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: .
    depends_on:
      selenium:
        condition: service_healthy

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    depends_on:
      selenium:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      BASE_URL: http://app:8080
      SELENIUM_REMOTE_URL: http://selenium:4444
